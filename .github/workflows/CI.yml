name: CI (yarn build)

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check if package.json has test script
        id: has_test
        run: |
          if [ -f package.json ]; then
            has_test=$(node -e "try { const p = require('./package.json'); console.log(Boolean(p.scripts && p.scripts.test)); } catch (e) { console.log('false'); }")
            echo "has_test=$has_test" >> $GITHUB_OUTPUT
          else
            echo "has_test=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.has_test.outputs.has_test == 'true'
        run: yarn test

      - name: Build
        run: yarn build

      - name: Pack CRX
        shell: bash
        # Never provide signing secrets to pull_request workflows.
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ github.event_name != 'pull_request' && secrets.CRX_PRIVATE_KEY_BASE64 || '' }}
        run: |
          set -euo pipefail

          chrome_bin="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [[ -z "$chrome_bin" ]]; then
            echo "::error::Chrome/Chromium is not installed on this runner."
            exit 1
          fi

          key_file="$RUNNER_TEMP/cloaq-crx-key.pem"
          trap 'rm -f "$key_file"' EXIT

          if [[ -n "$CRX_PRIVATE_KEY_BASE64" ]]; then
            printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
            echo "Packaging with the configured CRX signing key."
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_file" >/dev/null 2>&1
            echo "::warning::Using a temporary CRX key: the extension ID will change between builds. Configure CRX_PRIVATE_KEY_BASE64 to keep it stable on main."
          fi

          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -noout >/dev/null
          "$chrome_bin" --headless --no-sandbox --no-first-run --disable-gpu --disable-dev-shm-usage --no-message-box \
            "--pack-extension=$GITHUB_WORKSPACE/build" \
            "--pack-extension-key=$key_file"

          test -s build.crx
          test "$(head -c 4 build.crx)" = "Cr24"
          mv build.crx cloaq.crx

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed CRX extension
        uses: actions/upload-artifact@v7
        with:
          name: cloaq-crx
          path: cloaq.crx
          retention-days: 30
          if-no-files-found: error
